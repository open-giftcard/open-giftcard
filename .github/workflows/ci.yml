name: CI

# Every guarantee this project relies on — RLS tenant isolation, append-only
# audit privileges, atomic audit, and the module boundaries — is verified by the
# test suite. This workflow is the gate that makes those guarantees real
# (ADR-022, REVIEW-001 H1).

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Release compatibility contract
        shell: pwsh
        run: ./scripts/Test-ReleaseContract.ps1

      # The source cites ADRs by number. This fails when a citation in a tracked
      # file has no published entry, which is what happened while docs/ was
      # excluded from publication wholesale.
      - name: Documentation references resolve
        shell: pwsh
        run: ./scripts/Test-DocumentationReferences.ps1

      - name: Staging acceptance evidence contract
        shell: pwsh
        run: ./scripts/Test-StagingAcceptanceRecord.ps1

      - name: Observability contract
        shell: pwsh
        run: |
          ./scripts/Test-ObservabilityContract.ps1
          ./scripts/Test-ObservabilityEvidence.ps1

      # Resolved from global.json so CI uses the same SDK family as local
      # development, rather than whatever happens to be latest on the runner.
      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Report toolchain
        run: dotnet --info

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Fast, no database required. Run first so boundary or domain breaks fail
      # before the slower suite starts a container.
      - name: Architecture tests
        run: >-
          dotnet test tests/GiftCardPlatform.ArchitectureTests/GiftCardPlatform.ArchitectureTests.csproj
          --no-build --configuration Release --logger "trx;LogFileName=architecture.trx"

      - name: Unit tests
        run: >-
          dotnet test tests/GiftCardPlatform.UnitTests/GiftCardPlatform.UnitTests.csproj
          --no-build --configuration Release --logger "trx;LogFileName=unit.trx"

      # Uses Testcontainers against real PostgreSQL. GitHub-hosted runners ship
      # with Docker, so GIFTCARD_TEST_CONNECTION is deliberately left unset and
      # the harness starts its own container. The EF InMemory and SQLite
      # providers cannot enforce RLS, so there is no substitute here.
      - name: Integration tests
        run: >-
          dotnet test tests/GiftCardPlatform.IntegrationTests/GiftCardPlatform.IntegrationTests.csproj
          --no-build --configuration Release --logger "trx;LogFileName=integration.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: warn

  compose:
    name: docker compose up reaches a healthy API
    runs-on: ubuntu-latest

    # The documented one-command path is the first thing a visitor tries, and it
    # cannot be verified on a developer machine without Docker. This job is where
    # it is proven: it runs the published instructions verbatim and fails if a
    # clean clone would not reach a healthy, migrated API.
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Create .env exactly as the README instructs
        run: |
          cp .env.example .env
          # The example ships placeholders; give this run real local values.
          python3 - <<'PY'
          import re, secrets, base64, pathlib
          path = pathlib.Path('.env')
          text = path.read_text()
          text = text.replace('change_me_locally_to_a_random_value_at_least_32_bytes',
                              secrets.token_urlsafe(48))
          text = text.replace('change_me_locally', secrets.token_urlsafe(24))
          text = re.sub(r'^Partners__EpinDeliveryKey=.*$',
                        'Partners__EpinDeliveryKey=' + base64.b64encode(secrets.token_bytes(32)).decode(),
                        text, flags=re.M)
          path.write_text(text)
          PY

      - name: docker compose up
        run: docker compose up --build --detach --wait --wait-timeout 600

      - name: Migrations ran as the migration owner and exited cleanly
        run: |
          code=$(docker inspect giftcard-migrations --format '{{.State.ExitCode}}')
          echo "migrations exit code: $code"
          docker logs giftcard-migrations
          test "$code" = "0"
          docker logs giftcard-migrations 2>&1 | grep -q 'all 12 module migrations applied'

      - name: API reports ready
        run: |
          port=$(grep -E '^API_PORT=' .env | cut -d= -f2)
          port=${port:-5143}
          for attempt in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${port}/health/ready"; then
              echo
              echo "API ready on ${port}"
              exit 0
            fi
            sleep 5
          done
          echo "API never became ready"
          docker compose logs api
          exit 1

      # VERSIONING.md promises /api/v1 will not break within 1.x and lists what
      # that forbids. This is where the promise stops being a convention: the
      # document this build serves is diffed against the accepted baseline in
      # contracts/, and a forbidden change fails the build.
      - name: API contract has no breaking changes
        shell: pwsh
        run: |
          $port = (Select-String -Path .env -Pattern '^API_PORT=(.*)$').Matches.Groups[1].Value
          if (-not $port) { $port = '5143' }
          ./scripts/Test-ApiCompatibility.ps1 -CurrentUrl "http://127.0.0.1:$port/swagger/v1/swagger.json"

      - name: Compose logs on failure
        if: failure()
        run: docker compose logs

  upgrade:
    name: A populated database upgrades to this build
    runs-on: ubuntu-latest

    # The second 1.0 promise is that any 1.x release applies cleanly on top of
    # any earlier 1.x database. Migrations here are forward-only and carry raw
    # SQL for policies, triggers and functions, so the failure mode is a
    # migration that works on an empty database and not on a populated one. The
    # single manual drill that had been done before this job existed found two
    # real defects, which is the argument for running it every time.
    steps:
      - name: Check out with history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Create .env with the demonstration seed enabled
        run: |
          cp .env.example .env
          python3 - <<'PY'
          import re, secrets, base64, pathlib
          path = pathlib.Path('.env')
          text = path.read_text()
          text = text.replace('change_me_locally_to_a_random_value_at_least_32_bytes',
                              secrets.token_urlsafe(48))
          text = text.replace('change_me_locally', secrets.token_urlsafe(24))
          text = re.sub(r'^Partners__EpinDeliveryKey=.*$',
                        'Partners__EpinDeliveryKey=' + base64.b64encode(secrets.token_bytes(32)).decode(),
                        text, flags=re.M)
          text = re.sub(r'^DEMO_SEED=.*$', 'DEMO_SEED=true', text, flags=re.M)
          path.write_text(text)
          PY
          grep -q '^DEMO_SEED=true$' .env

      # The baseline is whatever RELEASE_COMPATIBILITY.json accepts. Once tags
      # exist this should become the previous release tag; the commit is used
      # now because no repository has a tag yet, and a commit resolves.
      - name: Resolve the upgrade baseline
        id: baseline
        run: |
          commit=$(python3 -c "import json;print(json.load(open('RELEASE_COMPATIBILITY.json'))['backendContract']['commit'])")
          head=$(git rev-parse HEAD)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "Upgrading from $commit to $head"
          git cat-file -e "$commit^{commit}"
          if [ "$commit" = "$head" ]; then
            echo "The baseline is this commit, so there is nothing to upgrade."
            exit 1
          fi

      - name: Bring up the baseline and populate it
        run: |
          git checkout --quiet --detach ${{ steps.baseline.outputs.commit }}
          docker compose up --build --detach --wait --wait-timeout 600
          docker inspect giftcard-migrations --format '{{.State.ExitCode}}' | grep -qx 0

      - name: Confirm the baseline seeded real data
        id: seeded
        run: |
          set -eu
          # shellcheck disable=SC2046
          export $(grep -E '^(POSTGRES_DB|POSTGRES_SUPERUSER)=' .env | xargs)
          count=$(docker exec giftcard-postgres psql -U "$POSTGRES_SUPERUSER" -d "$POSTGRES_DB" -tAc \
            'select count(*) from ledger.entries')
          echo "ledger entries after seed: $count"
          test "$count" -gt 0

          # Recorded so the next step can say whether this run actually
          # exercised a schema change or only application compatibility.
          applied=0
          for schema in organizations audit identity authorization ledger \
                        corporate_credits gift_cards distribution sharing \
                        payments notifications partners; do
            rows=$(docker exec giftcard-postgres psql -U "$POSTGRES_SUPERUSER" -d "$POSTGRES_DB" -tAc \
              "select count(*) from \"${schema}\".__ef_migrations_history")
            applied=$((applied + rows))
          done
          echo "migrations at baseline: $applied"
          echo "baseline_migrations=$applied" >> "$GITHUB_OUTPUT"

      # Only the application is replaced. The database volume, and therefore the
      # populated schema, is the one the baseline left behind.
      - name: Apply this build's migrations over that database
        run: |
          git checkout --quiet --detach ${{ steps.baseline.outputs.head }}
          git log --oneline -1
          docker compose up --build --detach --wait --wait-timeout 600
          code=$(docker inspect giftcard-migrations --format '{{.State.ExitCode}}')
          docker logs giftcard-migrations
          test "$code" = "0"

      - name: The upgraded instance reports ready
        run: |
          port=$(grep -E '^API_PORT=' .env | cut -d= -f2)
          port=${port:-5143}
          for attempt in $(seq 1 30); do
            body=$(curl -fsS "http://127.0.0.1:${port}/health/ready" || true)
            if [ -n "$body" ]; then
              echo "$body"
              # Readiness returns 503 naming modules that are behind the build,
              # so an upgrade that half-applied is caught here rather than at
              # the first request that touches the missing column.
              echo "$body" | grep -q 'migrations-pending' && { echo "schema is behind the build"; exit 1; }
              exit 0
            fi
            sleep 5
          done
          echo "the upgraded API never became ready"
          docker compose logs api
          exit 1

      # A green tick on this job means different things depending on whether the
      # two commits differ in migrations, and the difference matters enough to
      # print rather than leave to be inferred. When they do not differ the job
      # still proves something real, that this build serves a database populated
      # by the baseline, but it has not exercised an upgrade and must not be
      # read as though it had.
      - name: Report what this run actually exercised
        run: |
          set -eu
          # shellcheck disable=SC2046
          export $(grep -E '^(POSTGRES_DB|POSTGRES_SUPERUSER)=' .env | xargs)
          applied=0
          for schema in organizations audit identity authorization ledger \
                        corporate_credits gift_cards distribution sharing \
                        payments notifications partners; do
            rows=$(docker exec giftcard-postgres psql -U "$POSTGRES_SUPERUSER" -d "$POSTGRES_DB" -tAc \
              "select count(*) from \"${schema}\".__ef_migrations_history")
            applied=$((applied + rows))
          done
          before=${{ steps.seeded.outputs.baseline_migrations }}
          added=$((applied - before))
          echo "migrations at baseline: $before"
          echo "migrations after upgrade: $applied"
          echo "applied by this build: $added"
          if [ "$added" -gt 0 ]; then
            echo "UPGRADE EXERCISED: $added migration(s) applied to a populated database."
          else
            echo "NO SCHEMA CHANGE: this build has the same migrations as the baseline."
            echo "This run proved that it serves a database the baseline populated."
            echo "It did not exercise a migration upgrade, because there was none to apply."
          fi
          echo "migrations_applied=$added" >> "$GITHUB_STEP_SUMMARY" || true

      - name: The seeded data survived the upgrade
        run: |
          set -eu
          # shellcheck disable=SC2046
          export $(grep -E '^(POSTGRES_DB|POSTGRES_SUPERUSER)=' .env | xargs)
          count=$(docker exec giftcard-postgres psql -U "$POSTGRES_SUPERUSER" -d "$POSTGRES_DB" -tAc \
            'select count(*) from ledger.entries')
          echo "ledger entries after upgrade: $count"
          test "$count" -gt 0
          # Value is conserved across the upgrade: every ledger transaction
          # still balances per currency.
          unbalanced=$(docker exec giftcard-postgres psql -U "$POSTGRES_SUPERUSER" -d "$POSTGRES_DB" -tAc \
            "select count(*) from (select transaction_id, currency from ledger.entries group by transaction_id, currency having sum(case direction when 'Credit' then amount when 'Debit' then -amount else 0 end) <> 0) unbalanced")
          echo "unbalanced ledger transactions: $unbalanced"
          test "$unbalanced" = "0"

      - name: Compose logs on failure
        if: failure()
        run: docker compose logs
