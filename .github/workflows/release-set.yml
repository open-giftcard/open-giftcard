name: Coordinated release set

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-set.yml"
      - "docs/DEPLOYMENT.md"
      - "LICENSE"
      - "monitoring/**"
      - "README.md"
      - "RELEASE_COMPATIBILITY.json"
      - "RELEASE_READINESS.md"
      - "SECURITY.md"
      - "scripts/Build-ReleaseArtifacts.ps1"
      - "scripts/New-StagingAcceptanceRecord.ps1"
      - "scripts/Test-ObservabilityContract.ps1"
      - "scripts/Test-ObservabilityEvidence.ps1"
      - "scripts/Test-OpenGiftCardObservability.ps1"
      - "scripts/Test-OpenGiftCardSmoke.ps1"
      - "scripts/Test-ReleaseContract.ps1"
      - "scripts/Test-ReleaseSet.ps1"
      - "scripts/Test-StagingAcceptanceRecord.ps1"
      - "STAGING_ACCEPTANCE.example.json"
      - "VERSIONING.md"
  pull_request:
    paths:
      - ".github/workflows/release-set.yml"
      - "docs/DEPLOYMENT.md"
      - "LICENSE"
      - "monitoring/**"
      - "README.md"
      - "RELEASE_COMPATIBILITY.json"
      - "RELEASE_READINESS.md"
      - "SECURITY.md"
      - "scripts/Build-ReleaseArtifacts.ps1"
      - "scripts/New-StagingAcceptanceRecord.ps1"
      - "scripts/Test-ObservabilityContract.ps1"
      - "scripts/Test-ObservabilityEvidence.ps1"
      - "scripts/Test-OpenGiftCardObservability.ps1"
      - "scripts/Test-OpenGiftCardSmoke.ps1"
      - "scripts/Test-ReleaseContract.ps1"
      - "scripts/Test-ReleaseSet.ps1"
      - "scripts/Test-StagingAcceptanceRecord.ps1"
      - "STAGING_ACCEPTANCE.example.json"
      - "VERSIONING.md"
  workflow_dispatch:
    inputs:
      ref:
        description: Matching branch or tag to verify in all four repositories
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: release-set-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Four-repository compatibility
    runs-on: windows-latest
    env:
      RELEASE_REF: ${{ github.event_name == 'pull_request' && github.head_ref || github.event_name == 'push' && github.ref_name || inputs.ref }}
    steps:
      - name: Check out backend
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: release-set/open-giftcard
          ref: ${{ env.RELEASE_REF }}

      - name: Check out portal
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: open-giftcard/open-giftcard-portal
          path: release-set/open-giftcard-portal
          ref: ${{ env.RELEASE_REF }}

      - name: Check out cardholder
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: open-giftcard/open-giftcard-cardholder
          path: release-set/open-giftcard-cardholder
          ref: ${{ env.RELEASE_REF }}

      - name: Check out POS
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: open-giftcard/open-giftcard-pos
          path: release-set/open-giftcard-pos
          ref: ${{ env.RELEASE_REF }}

      - name: Reject stale or mixed release contracts
        shell: pwsh
        run: >-
          ./release-set/open-giftcard/scripts/Test-ReleaseSet.ps1
          -PortalRoot ./release-set/open-giftcard-portal
          -CardholderRoot ./release-set/open-giftcard-cardholder
          -PosRoot ./release-set/open-giftcard-pos

      - name: Verify staging acceptance evidence contract
        shell: pwsh
        run: ./release-set/open-giftcard/scripts/Test-StagingAcceptanceRecord.ps1

      - name: Verify observability contract
        shell: pwsh
        run: |
          ./release-set/open-giftcard/scripts/Test-ObservabilityContract.ps1
          ./release-set/open-giftcard/scripts/Test-ObservabilityEvidence.ps1

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: release-set/open-giftcard/global.json

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: release-set/open-giftcard-portal/src/GiftCardPortal.Web/pnpm-lock.yaml

      - name: Restore .NET repositories
        shell: pwsh
        run: |
          dotnet restore ./release-set/open-giftcard/GiftCardPlatform.slnx
          dotnet restore ./release-set/open-giftcard-portal/GiftCardPortal.slnx
          dotnet restore ./release-set/open-giftcard-cardholder/GiftCardCardholder.slnx
          dotnet restore ./release-set/open-giftcard-pos/GiftCardPos.slnx

      - name: Install portal frontend
        working-directory: release-set/open-giftcard-portal/src/GiftCardPortal.Web
        run: pnpm install --frozen-lockfile

      - name: Download pinned Microsoft SBOM Tool
        shell: pwsh
        run: |
          $sbomToolPath = Join-Path $env:RUNNER_TEMP 'sbom-tool-v4.1.5.exe'
          Invoke-WebRequest -Uri 'https://github.com/microsoft/sbom-tool/releases/download/v4.1.5/sbom-tool-win-x64.exe' -OutFile $sbomToolPath
          $expectedHash = '625767B371B7FDD58F40F618B8A86DA0247A33C89E419039C86B4EDBA1DAD4B5'
          $actualHash = (Get-FileHash -LiteralPath $sbomToolPath -Algorithm SHA256).Hash
          if ($actualHash -cne $expectedHash) {
            throw "Microsoft SBOM Tool hash $actualHash does not match $expectedHash."
          }
          "SBOM_TOOL_PATH=$sbomToolPath" >> $env:GITHUB_ENV

      - name: Build coordinated release artifacts
        working-directory: release-set/open-giftcard
        shell: pwsh
        run: >-
          ./scripts/Build-ReleaseArtifacts.ps1
          -OutputDirectory ../../release-artifacts
          -SbomToolPath $env:SBOM_TOOL_PATH
          -NoRestore

      - name: Upload coordinated artifact set
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: open-giftcard-release-set
          path: release-artifacts
          if-no-files-found: error

  attest:
    name: Attest intentional release build
    if: github.event_name == 'workflow_dispatch'
    needs: compatibility
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download coordinated artifact set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: open-giftcard-release-set
          path: release-artifacts

      - name: Read release identity
        shell: pwsh
        run: |
          $manifest = Get-Content -LiteralPath 'release-artifacts/ARTIFACTS.json' -Raw | ConvertFrom-Json
          if ([string]$manifest.release -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$') {
            throw "Artifact manifest carries invalid release '$($manifest.release)'."
          }
          "RELEASE_VERSION=$($manifest.release)" >> $env:GITHUB_ENV

      - name: Attest ZIP provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: release-artifacts/*.zip

      - name: Attest backend SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: release-artifacts/open-giftcard-backend-${{ env.RELEASE_VERSION }}.zip
          sbom-path: release-artifacts/open-giftcard-backend-${{ env.RELEASE_VERSION }}.spdx.json

      - name: Attest portal SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: release-artifacts/open-giftcard-portal-${{ env.RELEASE_VERSION }}.zip
          sbom-path: release-artifacts/open-giftcard-portal-${{ env.RELEASE_VERSION }}.spdx.json

      - name: Attest cardholder SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: release-artifacts/open-giftcard-cardholder-${{ env.RELEASE_VERSION }}.zip
          sbom-path: release-artifacts/open-giftcard-cardholder-${{ env.RELEASE_VERSION }}.spdx.json

      - name: Attest POS SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: release-artifacts/open-giftcard-pos-${{ env.RELEASE_VERSION }}.zip
          sbom-path: release-artifacts/open-giftcard-pos-${{ env.RELEASE_VERSION }}.spdx.json
