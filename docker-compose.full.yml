# The whole product: the API plus the two browser clients.
#
#   docker compose -f docker-compose.yml -f docker-compose.full.yml up
#
# This is an overlay on docker-compose.yml rather than a replacement, so the
# platform database, its two roles, the migration container and the API keep
# exactly the definitions the base file gives them.
#
# It expects the client repositories cloned as siblings of this one, which is
# how they are meant to be used:
#
#   open-giftcard/              this repository
#   open-giftcard-portal/
#   open-giftcard-cardholder/
#
# Set DEMO_SEED=true in .env first, or the portal has nothing to show and no
# account to sign in with. The credentials are in README.md.
#
# The POS till is deliberately absent. Its device credential is generated by
# the backend, returned once, and stored only as a hash, so there is no way to
# hand a container a working secret without weakening the property that makes
# the credential worth having. Register a till by hand when you want one; the
# POS repository's README covers it.
services:
  # PostgreSQL only runs its init directory when a data volume is first
  # created, so a stack brought up with the base file alone would never get the
  # client databases. This creates them as an ordinary service instead, and is
  # safe to re-run.
  client-databases:
    image: postgres:17
    container_name: giftcard-client-databases
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_SUPERUSER: ${POSTGRES_SUPERUSER:?set POSTGRES_SUPERUSER in .env}
      PGPASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in .env}
      PORTAL_DB: ${PORTAL_DB:-giftcard_portal}
      PORTAL_APP_USER: ${PORTAL_APP_USER:-giftcard_portal_app}
      PORTAL_APP_PASSWORD: ${PORTAL_APP_PASSWORD:?set PORTAL_APP_PASSWORD in .env}
      PORTAL_MIGRATOR_USER: ${PORTAL_MIGRATOR_USER:-giftcard_portal_migrator}
      PORTAL_MIGRATOR_PASSWORD: ${PORTAL_MIGRATOR_PASSWORD:?set PORTAL_MIGRATOR_PASSWORD in .env}
      CARDHOLDER_DB: ${CARDHOLDER_DB:-giftcard_cardholder}
      CARDHOLDER_APP_USER: ${CARDHOLDER_APP_USER:-giftcard_cardholder_app}
      CARDHOLDER_APP_PASSWORD: ${CARDHOLDER_APP_PASSWORD:?set CARDHOLDER_APP_PASSWORD in .env}
      CARDHOLDER_MIGRATOR_USER: ${CARDHOLDER_MIGRATOR_USER:-giftcard_cardholder_migrator}
      CARDHOLDER_MIGRATOR_PASSWORD: ${CARDHOLDER_MIGRATOR_PASSWORD:?set CARDHOLDER_MIGRATOR_PASSWORD in .env}
    volumes:
      - ./infra/postgres/create-client-databases.sh:/create-client-databases.sh:ro
    entrypoint: ["bash", "/create-client-databases.sh"]
    restart: "no"

  portal-migrations:
    build:
      context: ../open-giftcard-portal
    image: open-giftcard-portal
    container_name: giftcard-portal-migrations
    depends_on:
      client-databases:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__PortalMigrations: >-
        Host=postgres;Port=5432;Database=${PORTAL_DB:-giftcard_portal};Username=${PORTAL_MIGRATOR_USER:-giftcard_portal_migrator};Password=${PORTAL_MIGRATOR_PASSWORD}
      ConnectionStrings__Portal: >-
        Host=postgres;Port=5432;Database=${PORTAL_DB:-giftcard_portal};Username=${PORTAL_APP_USER:-giftcard_portal_app};Password=${PORTAL_APP_PASSWORD}
    command: ["--migrate"]
    restart: "no"

  portal:
    build:
      context: ../open-giftcard-portal
    image: open-giftcard-portal
    container_name: giftcard-portal
    depends_on:
      portal-migrations:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Portal: >-
        Host=postgres;Port=5432;Database=${PORTAL_DB:-giftcard_portal};Username=${PORTAL_APP_USER:-giftcard_portal_app};Password=${PORTAL_APP_PASSWORD}
      # Container-to-container, so this is the service name rather than
      # localhost. The browser never talks to the API directly: the BFF holds
      # the refresh token server-side and the API stays bearer-only.
      Backend__BaseUrl: http://api:8080
      DataProtection__KeysPath: /var/lib/open-giftcard-portal/dataprotection-keys
    ports:
      - "${PORTAL_PORT:-5179}:8080"
    volumes:
      - giftcard-portal-dataprotection:/var/lib/open-giftcard-portal/dataprotection-keys
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health/ready > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  cardholder-migrations:
    build:
      context: ../open-giftcard-cardholder
    image: open-giftcard-cardholder
    container_name: giftcard-cardholder-migrations
    depends_on:
      client-databases:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__CardholderMigrations: >-
        Host=postgres;Port=5432;Database=${CARDHOLDER_DB:-giftcard_cardholder};Username=${CARDHOLDER_MIGRATOR_USER:-giftcard_cardholder_migrator};Password=${CARDHOLDER_MIGRATOR_PASSWORD}
      ConnectionStrings__Cardholder: >-
        Host=postgres;Port=5432;Database=${CARDHOLDER_DB:-giftcard_cardholder};Username=${CARDHOLDER_APP_USER:-giftcard_cardholder_app};Password=${CARDHOLDER_APP_PASSWORD}
    command: ["--migrate"]
    restart: "no"

  cardholder:
    build:
      context: ../open-giftcard-cardholder
    image: open-giftcard-cardholder
    container_name: giftcard-cardholder
    depends_on:
      cardholder-migrations:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Cardholder: >-
        Host=postgres;Port=5432;Database=${CARDHOLDER_DB:-giftcard_cardholder};Username=${CARDHOLDER_APP_USER:-giftcard_cardholder_app};Password=${CARDHOLDER_APP_PASSWORD}
      Backend__BaseUrl: http://api:8080
      DataProtection__KeysPath: /var/lib/open-giftcard-cardholder/dataprotection-keys
    ports:
      - "${CARDHOLDER_PORT:-5180}:8080"
    volumes:
      - giftcard-cardholder-dataprotection:/var/lib/open-giftcard-cardholder/dataprotection-keys
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health/ready > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

volumes:
  giftcard-portal-dataprotection:
  giftcard-cardholder-dataprotection:
